[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passwitness"
version = "0.1.0"
description = "A fail-closed formal correctness debugger for small combinational synthesis flows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
passwitness = "passwitness.cli:main"

[tool.setuptools.packages.find]
include = ["passwitness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs an external Yosys tool"]
